spring.application.name=ms-pedido


server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://10.0.155.8:3306/pedidos?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Nombre de la cola SQS
app.sqs.queue-pedidos=cola-pedidos